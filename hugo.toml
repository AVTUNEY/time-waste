baseURL = "https://avtandili.ge/"
languageCode = "en-us"
title = "Avtandil's Dev Log"
theme = "gokarna"

[params]
  accentColor = "#E4572E"
  avatarAltText = "Site avatar"
  avatarSize = "size-m"
  avatarURL = "/images/azdevsummit.jpeg"
  dateFormat = "Jan 2, 2006"
  description = "Notes, projects, and thoughts."
  displayReadingTime = true
  fontSize = "1.1rem"
  metaKeywords = ["blog", "notes", "hugo"]
  numberPostsOnHomePage = 6
  showBackToTopButton = true
  showPostsOnHomePage = "recent"
  togglePreviousAndNextButtons = true

  socialIcons = [
    {name = "github", url = "https://github.com/AVTUNEY"},
    {name = "twitter", url = "https://x.com/avtuney_?s=21"},
    {name = "linkedin", url = "https://www.linkedin.com/in/avtuney/"},
    {name = "stackoverflow", url = "https://stackoverflow.com/users/12242162/avtuney"},
    {name = "email", url = "mailto:a.ushikishvili@gmail.com"}
  ]

  customCommentHTML = """
    <div class="giscus"></div>
    <script>
      (function() {
        var THEME_PREF_STORAGE_KEY = "theme-preference";
        var GISCUS_LIGHT = "light";
        var GISCUS_DARK = "dark_dimmed";

        function getPreferredTheme() {
          var stored = localStorage.getItem(THEME_PREF_STORAGE_KEY);
          if (stored === "dark" || stored === "light") {
            return stored;
          }
          return "dark";
        }

        function giscusThemeFor(theme) {
          return theme === "dark" ? GISCUS_DARK : GISCUS_LIGHT;
        }

        function setGiscusTheme(theme) {
          var iframe = document.querySelector("iframe.giscus-frame");
          if (!iframe) {
            return;
          }
          iframe.contentWindow.postMessage(
            { giscus: { setConfig: { theme: giscusThemeFor(theme) } } },
            "https://giscus.app"
          );
        }

        function loadGiscus() {
          var script = document.createElement("script");
          script.src = "https://giscus.app/client.js";
          script.setAttribute("data-repo", "AVTUNEY/time-waste");
          script.setAttribute("data-repo-id", "R_kgDOQ6aI3A");
          script.setAttribute("data-category", "General");
          script.setAttribute("data-category-id", "DIC_kwDOQ6aI3M4C1ANi");
          script.setAttribute("data-mapping", "pathname");
          script.setAttribute("data-strict", "0");
          script.setAttribute("data-reactions-enabled", "1");
          script.setAttribute("data-emit-metadata", "1");
          script.setAttribute("data-input-position", "top");
          script.setAttribute("data-theme", giscusThemeFor(getPreferredTheme()));
          script.setAttribute("data-lang", "en");
          script.setAttribute("data-loading", "lazy");
          script.crossOrigin = "anonymous";
          script.async = true;
          var container = document.querySelector(".giscus");
          if (container) {
            container.appendChild(script);
          }
        }

        function bindThemeToggle() {
          var toggles = document.querySelectorAll(".dark-theme-toggle");
          if (!toggles.length) {
            return;
          }
          toggles.forEach(function(toggle) {
            toggle.addEventListener("click", function() {
              setTimeout(function() {
                setGiscusTheme(getPreferredTheme());
              }, 0);
            });
          });
        }

        function bindSystemTheme() {
          return;
        }

        window.addEventListener("message", function(event) {
          if (event.origin !== "https://giscus.app") {
            return;
          }
          if (event.data && event.data.giscus && event.data.giscus.discussion) {
            setGiscusTheme(getPreferredTheme());
          }
        });

        loadGiscus();
        bindThemeToggle();
        bindSystemTheme();
      })();
    </script>
  """

